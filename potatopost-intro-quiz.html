<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PotatoPost 品牌導覽任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#5C8A3A;
    --yellow:#F4B740;
    --dark-green:#3D4A2E;
    --dark-green-text:#F7F3ED;
    --dark-green-text-2:#C2D2A8;
    --green-pale:#E6EDD7;
    --bg:#F3F6EC;
    --card:#fff;
    --border:#DEE7CD;
    --text:#2C2722;
    --text-2:#6E665C;
    --text-3:#A89F93;
    --chip-green-bg:#E2EDD0;
    --chip-green-text:#5E7038;
    --chip-yellow-bg:#FCEFD2;
    --chip-yellow-text:#9A7320;
    --card-shadow:0 6px 24px rgba(60,74,46,.06);
    --card-shadow-lg:0 16px 40px rgba(60,74,46,.10);
    --btn-shadow:0 6px 16px rgba(92,138,58,.35);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body{
    font-family:'Noto Sans TC','Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Poppins','Noto Sans TC',sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 20px; }

  /* ===== 區塊一：HERO ===== */
  .hero{
    padding:22px 20px 6px;
    text-align:center;
  }
  .hero img{
    height:60px;
    width:auto;
  }

  /* ===== 通用 section ===== */
  .section{ padding:16px 0 0; }

  /* ===== 任務影片 + 內嵌問卷 ===== */
  .video-card{
    position:relative;
    max-width:380px; margin:0 auto;
    border-radius:20px; overflow:hidden;
    box-shadow:var(--card-shadow-lg);
    background:var(--dark-green);
  }
  .video-card video{
    display:block; width:100%; aspect-ratio:9/16; object-fit:cover;
  }
  .video-card video.hidden{ display:none; }

  /* 播放時用 CSS 撐滿畫面（不呼叫裝置全螢幕 API，避免跳出系統原生播放器和它的控制列） */
  .video-card.video-fullscreen{
    position:fixed; inset:0; z-index:9999;
    max-width:none; width:100vw; height:100vh; height:100dvh;
    border-radius:0; box-shadow:none; margin:0;
  }
  .video-card.video-fullscreen video{
    width:100%; height:100%; aspect-ratio:auto; object-fit:contain;
  }

  .video-overlay{
    display:none;
    flex-direction:column;
    padding:26px 22px 24px;
  }
  .video-overlay.active{ display:flex; }

  .quiz-screen{ display:none; }
  .quiz-screen.active{ display:block; }

  .step-label{
    font-size:12px; font-weight:700; color:var(--yellow);
    letter-spacing:.5px; margin-bottom:10px;
  }
  .quiz-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--chip-yellow-bg); color:var(--chip-yellow-text);
    font-weight:700; font-size:12.5px; padding:7px 14px;
    border-radius:999px; margin-bottom:14px;
  }
  .quiz-lead{ font-size:13.5px; line-height:1.75; color:var(--dark-green-text-2); margin-bottom:20px; }
  .btn-primary{
    display:block; width:100%; text-align:center;
    background:var(--green); color:#fff;
    font-weight:700; font-size:15px; padding:14px;
    border:none; border-radius:999px; cursor:pointer;
    box-shadow:var(--btn-shadow);
    transition:opacity .2s;
  }
  .btn-primary.disabled{ opacity:.3; pointer-events:none; box-shadow:none; }

  .progress-wrap{ background:rgba(255,255,255,.16); border-radius:99px; height:6px; margin-bottom:22px; overflow:hidden; }
  .progress-bar{ height:100%; background:var(--yellow); border-radius:99px; transition:width .4s ease; }
  .q-count{ font-size:12.5px; color:var(--dark-green-text-2); margin-bottom:8px; }
  .q-text{ font-size:16.5px; font-weight:700; line-height:1.5; margin-bottom:20px; color:var(--dark-green-text); }
  .q-text.with-hint{ margin-bottom:6px; }
  .q-multi-hint{ display:none; font-size:11.5px; font-weight:500; color:var(--dark-green-text-2); margin-bottom:14px; }
  .q-multi-hint.show{ display:block; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .option{
    background:#fff;
    padding:13px 16px; border:1.5px solid var(--border); border-radius:14px;
    font-size:14px; color:var(--text); cursor:pointer; user-select:none;
    transition:border-color .15s, background .15s;
  }
  .option:hover{ border-color:var(--green); }
  .option.selected{ border-color:var(--green); background:var(--chip-green-bg); color:var(--chip-green-text); font-weight:600; }

  .result-visual{
    display:block; width:100%; height:auto;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:var(--card-shadow-lg);
  }

  .btn-retry{
    display:block; margin:14px auto 0; font-size:12.5px; color:var(--dark-green-text-2);
    background:none; border:none; cursor:pointer; text-decoration:underline;
    text-underline-offset:3px;
  }
  .btn-retry:hover{ color:var(--dark-green-text); }
</style>
</head>
<body>

  <!-- 區塊一：強烈視覺與吸睛標題 -->
  <div class="hero">
    <img src="assets/logo/potato-post-lockup-horizontal.svg" alt="PotatoPost">
  </div>

  <div class="wrap">

    <!-- 區塊二：任務影片＋內嵌問卷 -->
    <div class="section">
      <div class="video-card">
        <video id="task-video" class="hidden" playsinline preload="metadata" poster="assets/video/potatopost-task-poster.jpg">
          <source src="assets/video/potatopost-task.mp4" type="video/mp4">
        </video>

        <div class="video-overlay active" id="video-overlay">

          <!-- 步驟一：觀看影片 -->
          <div class="quiz-screen active" id="screen-intro">
            <p class="step-label">步驟一：觀看影片</p>
            <p class="quiz-lead">準備好了嗎？點擊開始觀看任務影片</p>
            <button class="btn-primary" onclick="startVideo()">開始觀看</button>
          </div>

          <!-- 測驗說明 -->
          <div class="quiz-screen" id="screen-lead">
            <p class="step-label">步驟二：回答題目</p>
            <div class="quiz-badge">🍯 答題拿 20 Honey</div>
            <p class="quiz-lead">看完影片了嗎？馬上回答以下 3 題！</p>
            <button class="btn-primary" onclick="goToQuiz()">馬上挑戰</button>
          </div>

          <!-- 答題 -->
          <div class="quiz-screen" id="screen-quiz">
            <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
            <p class="q-count" id="question-count">第 1 題，共 3 題</p>
            <p class="q-text" id="question-text"></p>
            <p class="q-multi-hint" id="q-multi-hint">可複選</p>
            <div class="options" id="options"></div>
            <button class="btn-primary disabled" id="btn-next" onclick="nextQuestion()">下一題</button>
          </div>

          <!-- 完成 -->
          <div class="quiz-screen" id="screen-result">
            <img class="result-visual" src="assets/img/task-complete.png" alt="任務完成，恭喜通關，PotatoPost 首月 50% OFF">
            <button class="btn-primary" onclick="tryPotatoPost()">馬上體驗 PotatoPost</button>

            <button class="btn-retry" onclick="retry()">重新看一次影片</button>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script>
    const questions = [
      {
        text: "你最希望 PotatoPost 先幫你解決哪一件事？",
        multiple: true,
        options: [
          "更快完成社群貼文或行銷文案",
          "產出可直接使用的圖片或設計素材",
          "規劃影片腳本、分鏡或短影音",
          "維持一致的品牌風格與內容計畫",
          "還不確定，想先體驗看看"
        ]
      },
      {
        text: "下列哪一項最符合你目前的身分？",
        options: [
          "個人創作者／自媒體經營者",
          "自由工作者／專業工作者",
          "創業者／企業經營者",
          "行銷、品牌或團隊成員",
          "學生／教師",
          "其他"
        ]
      },
      {
        text: "你的年齡區間是？",
        options: [
          "17 歲以下",
          "18–24 歲",
          "25–34 歲",
          "35–44 歲",
          "45–54 歲",
          "55 歲以上",
          "不方便回答"
        ]
      }
    ];

    let current = 0;
    const answers = [];

    // 部署 apps-script.gs 後把 /exec 網址填在這裡
    const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzdLQNUBIkqq0WUdDawe6SXV1RL3tD2nf--F-2OGS6IzqdmLcpIugswsHGvFDcHfsI-/exec';

    // 要跟 apps-script.gs 的 APP_SECRET 一致，用來過濾亂打這個端點的機器人（不是真正的安全機制，只是墊高亂打的門檻）
    const APP_SECRET = '71410aed4be032bf480513ced8ed5f16';

    // Buzzer App 開啟這個頁面時，網址帶 ?user=xxx 夾帶用戶 ID
    const USER_ID = new URLSearchParams(window.location.search).get('user') || '';

    const taskVideo = document.getElementById('task-video');
    const videoOverlay = document.getElementById('video-overlay');
    const videoCard = document.querySelector('.video-card');

    // 沒有 controls 可以拖拉了，但保險再擋一次：不能跳到還沒看過的進度
    let maxWatched = 0;
    taskVideo.addEventListener('timeupdate', () => {
      if (taskVideo.currentTime > maxWatched + 0.5) {
        taskVideo.currentTime = maxWatched;
      } else {
        maxWatched = taskVideo.currentTime;
      }
    });
    taskVideo.addEventListener('seeking', () => {
      if (taskVideo.currentTime > maxWatched + 0.5) {
        taskVideo.currentTime = maxWatched;
      }
    });

    function shrinkVideo(){
      videoCard.classList.remove('video-fullscreen');
      document.body.style.overflow = '';
    }

    taskVideo.addEventListener('ended', () => {
      shrinkVideo();
      taskVideo.classList.add('hidden');
      videoOverlay.classList.add('active');
      showScreen('screen-lead');
    });

    function showScreen(id){
      document.querySelectorAll('.quiz-screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function playVideo(){
      maxWatched = 0;
      videoOverlay.classList.remove('active');
      taskVideo.classList.remove('hidden');
      videoCard.classList.add('video-fullscreen');
      document.body.style.overflow = 'hidden';
      taskVideo.play().catch(() => {});
    }

    function startVideo(){
      playVideo();
    }

    function goToQuiz(){
      current = 0;
      answers.length = 0;
      showScreen('screen-quiz');
      renderQuestion();
    }

    function renderQuestion(){
      const q = questions[current];

      document.getElementById('question-count').textContent = `第 ${current + 1} 題，共 ${questions.length} 題`;
      document.getElementById('question-text').textContent = q.text;
      document.getElementById('question-text').classList.toggle('with-hint', !!q.multiple);
      document.getElementById('q-multi-hint').classList.toggle('show', !!q.multiple);
      document.getElementById('progress-bar').style.width = `${(current / questions.length) * 100}%`;

      answers[current] = q.multiple ? [] : undefined;

      const btnNext = document.getElementById('btn-next');
      btnNext.textContent = current === questions.length - 1 ? '完成' : '下一題';
      btnNext.classList.add('disabled');

      const container = document.getElementById('options');
      container.innerHTML = '';
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => selectOption(i);
        container.appendChild(div);
      });
    }

    function selectOption(index){
      const q = questions[current];
      const opts = document.querySelectorAll('.option');

      if (q.multiple){
        opts[index].classList.toggle('selected');
        answers[current] = Array.from(opts)
          .filter(o => o.classList.contains('selected'))
          .map(o => o.textContent);
        document.getElementById('btn-next').classList.toggle('disabled', answers[current].length === 0);
      } else {
        answers[current] = q.options[index];
        opts.forEach((opt, i) => opt.classList.toggle('selected', i === index));
        document.getElementById('btn-next').classList.remove('disabled');
      }
    }

    function submitResponses(){
      if (!SHEET_ENDPOINT || !SHEET_ENDPOINT.startsWith('https://script.google.com')) return;
      // q1 可能是陣列（複選），直接送陣列，不要先合併成字串——選項文字本身可能包含「、」，合併後無法安全切回去
      fetch(SHEET_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ secret: APP_SECRET, uid: USER_ID, q1: answers[0], q2: answers[1], q3: answers[2] })
      }).catch(err => console.error('問卷回覆送出失敗', err));
    }

    function nextQuestion(){
      current++;
      if (current >= questions.length){
        showResult();
      } else {
        renderQuestion();
      }
    }

    function showResult(){
      submitResponses();
      showScreen('screen-result');
    }

    function retry(){
      taskVideo.currentTime = 0;
      showScreen('screen-lead');
      playVideo();
    }

    function tryPotatoPost(){
      window.location.href = 'https://app.potatopost.tw/#/offer?plan=lite&promo=BuzzerSale';
    }
  </script>

</body>
</html>
