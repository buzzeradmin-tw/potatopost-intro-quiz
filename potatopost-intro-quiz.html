<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PotatoPost 品牌導覽任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#5C8A3A;
    --yellow:#F4B740;
    --dark-green:#3D4A2E;
    --dark-green-text:#F7F3ED;
    --dark-green-text-2:#C2D2A8;
    --green-pale:#E6EDD7;
    --bg:#F3F6EC;
    --card:#fff;
    --border:#DEE7CD;
    --text:#2C2722;
    --text-2:#6E665C;
    --text-3:#A89F93;
    --chip-green-bg:#E2EDD0;
    --chip-green-text:#5E7038;
    --chip-yellow-bg:#FCEFD2;
    --chip-yellow-text:#9A7320;
    --card-shadow:0 6px 24px rgba(60,74,46,.06);
    --card-shadow-lg:0 16px 40px rgba(60,74,46,.10);
    --btn-shadow:0 6px 16px rgba(92,138,58,.35);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body{
    font-family:'Noto Sans TC','Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Poppins','Noto Sans TC',sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 20px; }

  /* ===== 區塊一：HERO ===== */
  .hero{
    padding:22px 20px 6px;
    text-align:center;
  }
  .hero img{
    height:26px;
    width:auto;
  }

  /* ===== 通用 section ===== */
  .section{ padding:34px 0 0; }

  /* ===== 任務影片 + 內嵌問卷 ===== */
  .video-card{
    position:relative;
    max-width:380px; margin:0 auto;
    border-radius:20px; overflow:hidden;
    box-shadow:var(--card-shadow-lg);
    background:var(--dark-green);
  }
  .video-card video{
    display:block; width:100%; aspect-ratio:9/16; object-fit:cover;
  }
  .video-card video.hidden{ display:none; }

  .video-overlay{
    display:none;
    flex-direction:column;
    padding:26px 22px 24px;
  }
  .video-overlay.active{ display:flex; }

  .quiz-screen{ display:none; }
  .quiz-screen.active{ display:block; }

  .quiz-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--chip-yellow-bg); color:var(--chip-yellow-text);
    font-weight:700; font-size:12.5px; padding:7px 14px;
    border-radius:999px; margin-bottom:14px;
  }
  .quiz-lead{ font-size:13.5px; line-height:1.75; color:var(--dark-green-text-2); margin-bottom:20px; }
  .btn-primary{
    display:block; width:100%; text-align:center;
    background:var(--green); color:#fff;
    font-weight:700; font-size:15px; padding:14px;
    border:none; border-radius:999px; cursor:pointer;
    box-shadow:var(--btn-shadow);
    transition:opacity .2s;
  }
  .btn-primary.disabled{ opacity:.3; pointer-events:none; box-shadow:none; }

  .progress-wrap{ background:rgba(255,255,255,.16); border-radius:99px; height:6px; margin-bottom:22px; overflow:hidden; }
  .progress-bar{ height:100%; background:var(--yellow); border-radius:99px; transition:width .4s ease; }
  .q-count{ font-size:12.5px; color:var(--dark-green-text-2); margin-bottom:8px; }
  .q-text{ font-size:16.5px; font-weight:700; line-height:1.5; margin-bottom:20px; color:var(--dark-green-text); }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .option{
    background:#fff;
    padding:13px 16px; border:1.5px solid var(--border); border-radius:14px;
    font-size:14px; color:var(--text); cursor:pointer; user-select:none;
    transition:border-color .15s, background .15s;
  }
  .option:hover{ border-color:var(--green); }
  .option.selected{ border-color:var(--green); background:var(--chip-green-bg); color:var(--chip-green-text); font-weight:600; }

  .result-message{
    font-size:17px; font-weight:700; line-height:1.6;
    color:var(--dark-green-text);
    text-align:center;
    margin-bottom:22px;
  }

  .promo-block{
    margin-top:22px; padding-top:20px;
    border-top:1px solid rgba(255,255,255,.14);
    text-align:center;
  }
  .promo-price{ margin:2px 0 14px; }
  .promo-price-old{
    font-family:'Poppins'; font-size:15px; font-weight:600;
    color:var(--dark-green-text-2);
    text-decoration:line-through;
    margin-right:8px;
  }
  .promo-price-new{
    font-family:'Poppins'; font-size:25px; font-weight:800;
    color:var(--dark-green-text);
  }
  .promo-price-currency{
    font-size:11px; font-weight:600;
    color:var(--dark-green-text-2);
    margin-left:4px;
  }

  .plan-features{
    list-style:none;
    text-align:left;
    margin:0 0 20px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.14);
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .plan-features li{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
  }
  .feat-check{
    width:18px; height:18px; flex-shrink:0;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800;
  }
  .feat-label{
    color:var(--dark-green-text-2);
    flex:1;
  }
  .feat-value{
    color:var(--dark-green-text);
    font-weight:700;
  }

  .btn-retry{
    display:block; margin:14px auto 0; font-size:12.5px; color:var(--dark-green-text-2);
    background:none; border:none; cursor:pointer; text-decoration:underline;
    text-underline-offset:3px;
  }
  .btn-retry:hover{ color:var(--dark-green-text); }
</style>
</head>
<body>

  <!-- 區塊一：強烈視覺與吸睛標題 -->
  <div class="hero">
    <img src="assets/logo/potato-post-lockup-horizontal.svg" alt="PotatoPost">
  </div>

  <div class="wrap">

    <!-- 區塊二：任務影片＋內嵌問卷 -->
    <div class="section">
      <div class="video-card">
        <video id="task-video" controls playsinline preload="metadata" poster="assets/video/potatopost-task-poster.jpg">
          <source src="assets/video/potatopost-task.mp4" type="video/mp4">
        </video>

        <div class="video-overlay" id="video-overlay">

          <!-- 測驗說明 -->
          <div class="quiz-screen active" id="screen-lead">
            <div class="quiz-badge">🍯 答題拿 20 Honey</div>
            <p class="quiz-lead">看完影片了嗎？馬上回答以下 3 題！</p>
            <button class="btn-primary" onclick="goToQuiz()">馬上挑戰</button>
          </div>

          <!-- 答題 -->
          <div class="quiz-screen" id="screen-quiz">
            <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
            <p class="q-count" id="question-count">第 1 題，共 3 題</p>
            <p class="q-text" id="question-text"></p>
            <div class="options" id="options"></div>
            <button class="btn-primary disabled" id="btn-next" onclick="nextQuestion()">下一題</button>
          </div>

          <!-- 完成 -->
          <div class="quiz-screen" id="screen-result">
            <p class="result-message">恭喜通關，請截圖本頁回 Buzzer 任務頁交付任務領取 Honey 獎勵！</p>

            <div class="promo-block">
              <div class="quiz-badge">首月 50% OFF</div>
              <p class="promo-price">
                <span class="promo-price-old">$5.99</span>
                <span class="promo-price-new">$2.99</span>
                <span class="promo-price-currency">USD</span>
              </p>

              <ul class="plan-features">
                <li><span class="feat-check">✓</span><span class="feat-label">生成額度</span><span class="feat-value">180 點</span></li>
                <li><span class="feat-check">✓</span><span class="feat-label">每月影片</span><span class="feat-value">約 2 支</span></li>
                <li><span class="feat-check">✓</span><span class="feat-label">每月圖片</span><span class="feat-value">約 15 張</span></li>
                <li><span class="feat-check">✓</span><span class="feat-label">品牌數量</span><span class="feat-value">1 個</span></li>
                <li><span class="feat-check">✓</span><span class="feat-label">影片檔位</span><span class="feat-value">1 檔</span></li>
                <li><span class="feat-check">✓</span><span class="feat-label">素材保存</span><span class="feat-value">20 格</span></li>
              </ul>

              <button class="btn-primary" onclick="tryPotatoPost()">馬上體驗 PotatoPost</button>
            </div>

            <button class="btn-retry" onclick="retry()">重新看一次影片</button>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script>
    const questions = [
      {
        text: "你最希望 PotatoPost 先幫你解決哪一件事？",
        options: [
          "更快完成社群貼文或行銷文案",
          "產出可直接使用的圖片或設計素材",
          "規劃影片腳本、分鏡或短影音",
          "維持一致的品牌風格與內容計畫",
          "還不確定，想先體驗看看"
        ]
      },
      {
        text: "下列哪一項最符合你目前的身分？",
        options: [
          "個人創作者／自媒體經營者",
          "自由工作者／專業工作者",
          "創業者／企業經營者",
          "行銷、品牌或團隊成員",
          "學生／教師",
          "其他"
        ]
      },
      {
        text: "你的年齡區間是？",
        options: [
          "17 歲以下",
          "18–24 歲",
          "25–34 歲",
          "35–44 歲",
          "45–54 歲",
          "55 歲以上",
          "不方便回答"
        ]
      }
    ];

    let current = 0;
    const answers = [];

    // 部署 apps-script.gs 後把 /exec 網址填在這裡
    const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzdLQNUBIkqq0WUdDawe6SXV1RL3tD2nf--F-2OGS6IzqdmLcpIugswsHGvFDcHfsI-/exec';

    // Buzzer App 開啟這個頁面時，網址帶 ?user=xxx 夾帶用戶 ID
    const USER_ID = new URLSearchParams(window.location.search).get('user') || '';

    const taskVideo = document.getElementById('task-video');
    const videoOverlay = document.getElementById('video-overlay');

    taskVideo.addEventListener('ended', () => {
      taskVideo.classList.add('hidden');
      videoOverlay.classList.add('active');
    });

    function showScreen(id){
      document.querySelectorAll('.quiz-screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goToQuiz(){
      current = 0;
      answers.length = 0;
      showScreen('screen-quiz');
      renderQuestion();
    }

    function renderQuestion(){
      const q = questions[current];

      document.getElementById('question-count').textContent = `第 ${current + 1} 題，共 ${questions.length} 題`;
      document.getElementById('question-text').textContent = q.text;
      document.getElementById('progress-bar').style.width = `${(current / questions.length) * 100}%`;

      const btnNext = document.getElementById('btn-next');
      btnNext.textContent = current === questions.length - 1 ? '完成' : '下一題';
      btnNext.classList.add('disabled');

      const container = document.getElementById('options');
      container.innerHTML = '';
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => selectOption(i);
        container.appendChild(div);
      });
    }

    function selectOption(index){
      answers[current] = questions[current].options[index];

      document.querySelectorAll('.option').forEach((opt, i) => {
        opt.classList.toggle('selected', i === index);
      });

      document.getElementById('btn-next').classList.remove('disabled');
    }

    function submitResponses(){
      if (!SHEET_ENDPOINT || !SHEET_ENDPOINT.startsWith('https://script.google.com')) return;
      fetch(SHEET_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ uid: USER_ID, q1: answers[0], q2: answers[1], q3: answers[2] })
      }).catch(err => console.error('問卷回覆送出失敗', err));
    }

    function nextQuestion(){
      current++;
      if (current >= questions.length){
        showResult();
      } else {
        renderQuestion();
      }
    }

    function showResult(){
      submitResponses();
      showScreen('screen-result');
    }

    function retry(){
      videoOverlay.classList.remove('active');
      taskVideo.classList.remove('hidden');
      taskVideo.currentTime = 0;
      taskVideo.play();
      showScreen('screen-lead');
    }

    function tryPotatoPost(){
      window.location.href = 'https://app.potatopost.tw/#/offer?plan=lite&promo=BuzzerSale';
    }
  </script>

</body>
</html>
